services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: cloudvault-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cloudvault
      MINIO_ROOT_PASSWORD: cloudvault-local-secret
    volumes:
      - minio_data:/data
volumes:
  minio_data:
